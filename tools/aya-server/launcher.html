<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에이두 로블 — 기술 검증</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#f4f7ff;font:17px system-ui,sans-serif}main{max-width:850px;margin:10vh auto;padding:28px}h1{font-size:clamp(26px,6vw,44px)}p{line-height:1.7;color:#c5d0df}.panel{background:#1c2a39;border:1px solid #38536a;border-radius:22px;padding:24px;margin:20px 0}button,a{font:inherit}button{background:#94e8bb;border:0;border-radius:12px;padding:15px 25px;cursor:pointer;color:#12251b}input{background:#101923;border:1px solid #577285;border-radius:9px;padding:12px;color:white;max-width:100%;font:inherit}label{display:block;margin:10px 0}a{color:#94e8bb}.note{font-size:14px}#status{min-height:28px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:10}[hidden]{display:none!important}</style><main><h1>에이두 로블</h1><p>AyaWASM 기반 비공식 레거시 Roblox. 에이두 서버에서 직접 만든 공원 맵으로 접속하는 기술 검증 페이지입니다. 공식 Roblox 계정이나 현재 Roblox 게임과는 연결되지 않습니다.</p><section class="panel"><label for="name">캐릭터 이름</label><input id="name" maxlength="20" value="AieduePlayer"><p>이동 W·A·S·D / 방향키 · 점프 Space · 시점 마우스 · 나가기 Esc</p><button id="join">공원에 입장</button><p id="status" role="status">서버 상태를 확인하고 있어요.</p></section><p class="note">검증 모드: 루프백 서버와 SSH 터널만 사용합니다. 원본 런타임의 공개 재배포 권리는 별도 확인이 필요합니다.</p><a href="/runtime?apptype=studio">Studio 실행 검증</a></main><iframe id="game" title="에이두 로블 플레이어" allow="fullscreen;autoplay;clipboard-write" hidden></iframe><script>const nameEl=document.querySelector('#name'),statusEl=document.querySelector('#status');let uid=Number(sessionStorage.getItem('aya-preview-uid'));if(!Number.isSafeInteger(uid)||uid<1){uid=10000+crypto.getRandomValues(new Uint32Array(1))[0]%2000000000;sessionStorage.setItem('aya-preview-uid',uid)}fetch('/health').then(r=>r.json()).then(h=>{statusEl.textContent=h.ready?'공원 서버가 준비됐어요.': '서버가 아직 준비되지 않았어요.'}).catch(()=>statusEl.textContent='서버 연결을 확인해 주세요.');document.querySelector('#join').onclick=async()=>{const name=nameEl.value.trim();if(!/^[\p{L}\p{N}_ -]{1,20}$/u.test(name)){statusEl.textContent='이름은 글자·숫자·공백으로 1~20자 입력해 주세요.';return}const h=await fetch('/health').then(r=>r.json());if(!h.ready){statusEl.textContent='서버가 아직 준비되지 않았어요.';return}const params=new URLSearchParams({apptype:'player',embedded:'1',join:'100000001',t:'webrtc',u:name,uid:String(uid)});const frame=document.querySelector('#game');frame.src='/runtime?'+params;frame.hidden=false;};window.addEventListener('message',e=>{const f=document.querySelector('#game');if(e.origin===location.origin&&e.source===f.contentWindow&&e.data?.type==='aya-player-leave'){f.hidden=true;f.src='about:blank'}});</script></html>
