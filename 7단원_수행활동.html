<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 동네 탐험 미션 | 5학년 7단원</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nanum Gothic',sans-serif;background:linear-gradient(135deg,#fff3e0 0%,#ffe0b2 50%,#ffcc02 100%);min-height:100vh;padding:20px;}
h1{text-align:center;font-size:2em;color:#e65100;margin-bottom:5px;font-weight:800;}
.subtitle{text-align:center;color:#f57c00;margin-bottom:20px;font-size:1.1em;}
.progress-bar{background:#fff;border-radius:20px;padding:15px 20px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,0.1);display:flex;align-items:center;gap:15px;}
.stars{font-size:1.5em;}
.bar-wrap{flex:1;background:#ffe0b2;border-radius:10px;height:20px;}
.bar-fill{height:20px;background:linear-gradient(90deg,#ff9800,#ffcc02);border-radius:10px;transition:width 0.5s;}
.score-display{font-weight:800;color:#e65100;font-size:1.2em;}
.missions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:30px;}
.mission-card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,0.1);border:3px solid transparent;transition:all 0.3s;cursor:pointer;}
.mission-card:hover{transform:translateY(-5px);box-shadow:0 12px 30px rgba(0,0,0,0.15);}
.mission-card.locked{opacity:0.5;cursor:not-allowed;}
.mission-card.done{border-color:#4caf50;background:linear-gradient(135deg,#f1f8e9,#fff);}
.mission-card.active{border-color:#ff9800;}
.mission-icon{font-size:2.5em;margin-bottom:10px;}
.mission-title{font-size:1.1em;font-weight:800;color:#333;margin-bottom:5px;}
.mission-desc{font-size:0.9em;color:#666;margin-bottom:10px;line-height:1.5;}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.8em;font-weight:700;}
.badge-green{background:#e8f5e9;color:#2e7d32;}
.badge-orange{background:#fff3e0;color:#e65100;}
.badge-gray{background:#f5f5f5;color:#999;}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:12px;font-size:1em;font-weight:700;font-family:'Nanum Gothic',sans-serif;cursor:pointer;transition:all 0.2s;margin-top:10px;}
.btn-primary{background:linear-gradient(90deg,#ff9800,#f57c00);color:#fff;}
.btn-primary:hover{transform:scale(1.02);box-shadow:0 4px 12px rgba(255,152,0,0.4);}
.btn-secondary{background:#f5f5f5;color:#555;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal.show{display:flex;}
.modal-box{background:#fff;border-radius:24px;padding:30px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.modal-title{font-size:1.4em;font-weight:800;color:#e65100;margin-bottom:15px;}
.scenario{background:#fff8e1;border-radius:12px;padding:15px;margin-bottom:15px;line-height:1.8;font-size:0.95em;}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:15px;}
.choice-btn{padding:14px 16px;border:2px solid #ffe0b2;border-radius:12px;background:#fff;font-family:'Nanum Gothic',sans-serif;font-size:0.95em;font-weight:700;cursor:pointer;text-align:left;transition:all 0.2s;}
.choice-btn:hover{border-color:#ff9800;background:#fff3e0;}
.choice-btn.correct{border-color:#4caf50;background:#e8f5e9;color:#2e7d32;}
.choice-btn.wrong{border-color:#f44336;background:#ffebee;color:#c62828;}
.feedback{padding:15px;border-radius:12px;margin-bottom:15px;font-weight:700;line-height:1.6;display:none;}
.feedback.show{display:block;}
.feedback.correct{background:#e8f5e9;color:#2e7d32;}
.feedback.wrong{background:#ffebee;color:#c62828;}
.step-indicator{display:flex;gap:6px;margin-bottom:15px;}
.step-dot{width:10px;height:10px;border-radius:50%;background:#ddd;}
.step-dot.done{background:#ff9800;}
.step-dot.active{background:#f57c00;transform:scale(1.3);}
.complete-screen{text-align:center;padding:20px;}
.complete-screen .big-icon{font-size:4em;margin-bottom:15px;}
.stamp{display:inline-block;border:3px solid #4caf50;border-radius:12px;padding:8px 20px;color:#2e7d32;font-weight:800;font-size:0.9em;margin:5px;}
</style>
</head>
<body>
<h1>🗺️ 우리 동네 탐험 미션!</h1>
<p class="subtitle">5학년 사회 7단원 | 우리가 사는 지역의 모습</p>

<div class="progress-bar">
  <div class="stars" id="stars">⭐</div>
  <div class="bar-wrap"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  <div class="score-display"><span id="scoreNum">0</span> / 60점</div>
</div>

<div class="missions-grid" id="missionGrid"></div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const missions = [
  {
    id:1, icon:"🏠", title:"우리 동네 집 찾기", done:false, locked:false,
    desc:"우리 동네에는 다양한 모양의 집이 있어요. 각 가족에 맞는 집을 골라봐요!",
    steps:[
      {
        scenario:"민준이네 가족은 6명이에요. 할머니, 할아버지, 아빠, 엄마, 민준이, 동생. 이 가족이 살기에 가장 좋은 집은?",
        choices:["넓은 아파트","작은 원룸","컨테이너 박스","텐트"],
        answer:0, feedback:"✅ 맞아요! 가족이 많을수록 방이 많고 넓은 아파트가 좋아요. 아파트는 여러 가구가 함께 사는 집이에요."
      },
      {
        scenario:"지도를 보니 우리 동네에 아파트, 단독주택, 빌라가 있어요. 어떤 건물이 '우리 지역의 인문 환경'에 해당할까요?",
        choices:["산과 강","아파트와 단독주택","구름과 바람","논밭"],
        answer:1, feedback:"✅ 맞아요! 사람이 만든 집, 건물, 도로가 바로 인문 환경이에요. 산과 강은 자연환경이에요."
      },
      {
        scenario:"지호는 우리 동네 집들의 모습을 조사해서 발표해야 해요. 어떻게 하면 가장 좋을까요?",
        choices:["집에서 TV만 본다","직접 동네를 걸으며 사진 찍고 그림 그린다","인터넷에서 다른 동네 사진을 가져온다","모르면 안 한다"],
        answer:1, feedback:"✅ 바로 이거예요! 직접 관찰하고 사진 찍는 게 최고의 조사 방법이에요. 우리 동네를 두 눈으로 보는 거예요!"
      }
    ]
  },
  {
    id:2, icon:"🏢", title:"일하는 곳 찾아가기", done:false, locked:false,
    desc:"사람들이 일하는 다양한 곳을 알아봐요. 어떤 일을 어디서 할까요?",
    steps:[
      {
        scenario:"소연이 아빠는 아픈 사람을 돌봐요. 소연이 엄마는 물건을 팔아요. 두 분이 일하는 곳은 어디일까요?",
        choices:["아빠:병원, 엄마:시장(가게)","아빠:공원, 엄마:산","아빠:도서관, 엄마:놀이터","아빠:기차역, 엄마:은행"],
        answer:0, feedback:"✅ 맞아요! 아픈 사람을 돌보는 곳은 병원, 물건을 파는 곳은 시장이나 가게예요."
      },
      {
        scenario:"우리 동네에 새 마트가 생겼어요. 마트는 어떤 환경일까요?",
        choices:["자연환경","인문환경","우주환경","수중환경"],
        answer:1, feedback:"✅ 맞아요! 마트는 사람이 만든 건물이니 인문환경이에요!"
      },
      {
        scenario:"현장체험학습으로 '사람들이 일하는 곳'을 방문해요. 어디가 가장 좋을까요?",
        choices:["소방서, 우체국, 시청","사막, 밀림, 바다","화산, 빙하, 폭포","외국, 우주, 바닷속"],
        answer:0, feedback:"✅ 소방서, 우체국, 시청 모두 우리 지역에서 사람들이 일하는 대표적인 곳이에요!"
      }
    ]
  },
  {
    id:3, icon:"🎭", title:"문화시설 탐험", done:false, locked:false,
    desc:"배우고 즐기는 곳을 찾아봐요. 우리 동네의 문화 공간을 알아봐요!",
    steps:[
      {
        scenario:"서연이는 그림을 배우고 싶어요. 어디를 가면 좋을까요?",
        choices:["미술관 또는 문화센터","편의점","주유소","아파트 관리실"],
        answer:0, feedback:"✅ 맞아요! 미술관, 문화센터에서 그림을 배울 수 있어요. 배우는 곳도 인문환경이에요!"
      },
      {
        scenario:"공연을 보고 싶은 태민이. 어느 곳에 가야 할까요?",
        choices:["공원 벤치","영화관 또는 공연장","세탁소","병원"],
        answer:1, feedback:"✅ 맞아요! 영화관, 공연장은 문화를 즐기는 곳이에요."
      },
      {
        scenario:"우리 동네 문화시설을 지도에 표시하려고 해요. 어떤 표시를 사용하면 좋을까요?",
        choices:["그냥 점만 찍는다","각 장소에 맞는 그림 기호(아이콘)를 사용한다","아무거나 낙서한다","지도를 찢어버린다"],
        answer:1, feedback:"✅ 맞아요! 지도에는 각 장소를 나타내는 그림 기호를 사용해야 알아보기 쉬워요."
      }
    ]
  },
  {
    id:4, icon:"🏯", title:"옛날과 오늘날 건물", done:false, locked:false,
    desc:"우리 지역에 남아있는 옛날 건물과 오늘날 건물을 비교해봐요!",
    steps:[
      {
        scenario:"사진을 보니 지붕이 기와로 만들어진 집이 있어요. 이 집은 언제 만들어진 걸까요?",
        choices:["옛날에 만든 전통 가옥","오늘날 새로 지은 아파트","미래에 지을 우주선","다른 나라 집"],
        answer:0, feedback:"✅ 맞아요! 기와집은 옛날에 지어진 전통 가옥이에요. 우리 지역의 역사를 알 수 있는 인문환경이에요!"
      },
      {
        scenario:"옛날 건물과 오늘날 건물의 차이점을 조사했어요. 어떻게 발표하면 좋을까요?",
        choices:["옛날 건물 사진과 오늘날 건물 사진을 나란히 붙여 비교한다","그냥 말로만 설명한다","발표 안 한다","다른 사람 발표를 베낀다"],
        answer:0, feedback:"✅ 사진 비교가 최고예요! 변화와 지속의 의미를 한눈에 볼 수 있어요."
      },
      {
        scenario:"우리 동네 오래된 건물을 보존해야 할까요?",
        choices:["아니요, 다 부수고 새로 지어요","네, 지역의 역사와 문화를 간직한 소중한 인문환경이에요","모르겠어요","관심 없어요"],
        answer:1, feedback:"✅ 맞아요! 옛날 건물은 우리 지역의 역사와 문화가 담긴 소중한 인문환경이에요!"
      }
    ]
  },
  {
    id:5, icon:"🏛️", title:"공공시설 이용하기", done:false, locked:false,
    desc:"모두 함께 이용하는 공공시설을 찾아봐요!",
    steps:[
      {
        scenario:"불이 났어요! 빨리 신고해야 해요. 어디에 연락해야 할까요?",
        choices:["피자 가게","소방서 (119)","학교","슈퍼마켓"],
        answer:1, feedback:"✅ 맞아요! 소방서는 우리 모두를 위한 공공시설이에요. 불이 나면 119에 신고해요!"
      },
      {
        scenario:"공공시설의 특징은 무엇인가요?",
        choices:["돈이 많은 사람만 이용할 수 있다","특정 어른만 이용할 수 있다","모든 지역 주민이 함께 이용할 수 있다","외국인만 이용할 수 있다"],
        answer:2, feedback:"✅ 맞아요! 공공시설은 지역 주민 모두가 함께 이용하는 시설이에요. 도서관, 공원, 소방서 등이 있어요!"
      },
      {
        scenario:"우리 동네 공공시설 지도를 만들려고 해요. 어떤 시설을 표시해야 할까요?",
        choices:["개인 집","학교, 도서관, 소방서, 공원, 병원","비밀 장소","다른 나라 건물"],
        answer:1, feedback:"✅ 맞아요! 학교, 도서관, 소방서, 공원, 병원이 모두 공공시설이에요!"
      }
    ]
  },
  {
    id:6, icon:"🚌", title:"교통 환경 탐험", done:false, locked:false,
    desc:"우리 지역 사람들이 편리하게 다닐 수 있는 교통 환경을 알아봐요!",
    steps:[
      {
        scenario:"할머니 댁은 멀리 있어요. 가장 빠르게 갈 수 있는 교통수단은?",
        choices:["걸어서","자전거","기차 또는 버스","킥보드"],
        answer:2, feedback:"✅ 맞아요! 멀리 갈 때는 기차나 버스가 빠르고 편리해요. 이런 교통수단도 우리 지역 인문환경이에요!"
      },
      {
        scenario:"우리 동네 교통 환경을 조사하는 방법으로 가장 좋은 것은?",
        choices:["집에서 상상으로 그린다","직접 버스 노선도와 지하철 노선도를 찾아보고 관찰한다","선생님께 다 물어본다","포기한다"],
        answer:1, feedback:"✅ 맞아요! 직접 노선도를 찾아보고 관찰하는 탐구 학습이 최고예요!"
      },
      {
        scenario:"지도에서 버스 정류장과 지하철역을 표시하려고 해요. 어떤 기호가 좋을까요?",
        choices:["버스:🚌 지하철:🚇","아무 그림이나","숫자만","색깔만"],
        answer:0, feedback:"✅ 맞아요! 알아보기 쉬운 그림 기호로 표시하면 지도를 보는 모든 사람이 이해할 수 있어요!"
      }
    ]
  }
];

let currentMission = null;
let currentStep = 0;
let totalScore = 0;
let answered = false;

function updateProgress() {
  const done = missions.filter(m=>m.done).length;
  const pct = (done/missions.length)*100;
  document.getElementById('barFill').style.width = pct+'%';
  document.getElementById('scoreNum').textContent = totalScore;
  if(done>=2) document.getElementById('stars').textContent='⭐⭐';
  if(done>=4) document.getElementById('stars').textContent='⭐⭐⭐';
  if(done>=6) document.getElementById('stars').textContent='🌟🌟🌟🌟🌟';
}

function renderGrid() {
  const grid = document.getElementById('missionGrid');
  grid.innerHTML = missions.map(m=>`
    <div class="mission-card ${m.done?'done':''} ${m.locked?'locked':''}" onclick="openMission(${m.id})">
      <div class="mission-icon">${m.icon}</div>
      <div class="mission-title">${m.done?'✅ ':''} 미션 ${m.id}: ${m.title}</div>
      <div class="mission-desc">${m.desc}</div>
      <span class="badge ${m.done?'badge-green':m.locked?'badge-gray':'badge-orange'}">
        ${m.done?'완료! +10점':m.locked?'🔒 잠김':'도전하기!'}
      </span>
    </div>
  `).join('');
  updateProgress();
}

function openMission(id) {
  const m = missions.find(x=>x.id===id);
  if(m.locked) return;
  if(m.done) { showComplete(m); return; }
  currentMission = m;
  currentStep = 0;
  answered = false;
  showStep();
}

function showStep() {
  const m = currentMission;
  const s = m.steps[currentStep];
  const dots = m.steps.map((_,i)=>`<div class="step-dot ${i<currentStep?'done':i===currentStep?'active':''}"></div>`).join('');
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-title">${m.icon} 미션 ${m.id}: ${m.title}</div>
    <div class="step-indicator">${dots}</div>
    <div class="scenario">📋 <strong>상황:</strong> ${s.scenario}</div>
    <div class="choices" id="choices">
      ${s.choices.map((c,i)=>`<button class="choice-btn" id="c${i}" onclick="choose(${i})">${['①','②','③','④'][i]} ${c}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-secondary" id="nextBtn" style="display:none" onclick="nextStep()">다음 상황 → </button>
    <button class="btn btn-secondary" onclick="closeModal()">닫기</button>
  `;
  document.getElementById('modal').classList.add('show');
}

function choose(idx) {
  if(answered) return;
  answered = true;
  const s = currentMission.steps[currentStep];
  const fb = document.getElementById('feedback');
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b,i)=>{
    if(i===s.answer) b.classList.add('correct');
    else if(i===idx) b.classList.add('wrong');
    b.disabled = true;
  });
  if(idx===s.answer) {
    fb.className='feedback correct show';
    fb.innerHTML = s.feedback;
    totalScore += 10;
  } else {
    fb.className='feedback wrong show';
    fb.innerHTML = `❌ 다시 생각해봐요! <br>${s.feedback}`;
  }
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display='block';
  if(currentStep === currentMission.steps.length-1) {
    nextBtn.textContent = '🎉 미션 완료!';
  }
  updateProgress();
}

function nextStep() {
  currentStep++;
  if(currentStep >= currentMission.steps.length) {
    currentMission.done = true;
    renderGrid();
    showComplete(currentMission);
    return;
  }
  answered = false;
  showStep();
}

function showComplete(m) {
  document.getElementById('modalBox').innerHTML = `
    <div class="complete-screen">
      <div class="big-icon">🎉</div>
      <div class="modal-title">미션 완료!</div>
      <p style="font-size:1.2em;margin-bottom:15px;">${m.icon} <strong>${m.title}</strong><br>모든 상황을 해결했어요!</p>
      <div>
        <span class="stamp">✅ 탐험가 도장 획득!</span>
        <span class="stamp">⭐ +10점</span>
      </div>
      <p style="margin-top:15px;color:#666;">지금까지 <strong>${totalScore}점</strong> 획득!</p>
      <button class="btn btn-primary" style="margin-top:15px" onclick="closeModal()">다른 미션 도전하기!</button>
    </div>
  `;
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  renderGrid();
}

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

renderGrid();
</script>
</body>
</html>
