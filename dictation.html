<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로딩중... | 에이두 한글</title>
  <meta http-equiv="refresh" content="0; url=index.html?activity=dictation">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #fffdf7 0%, #eefcf8 100%);
      color: #2c3e50;
    }
    .card {
      min-width: min(320px, 86vw);
      border-radius: 28px;
      border: 2px solid rgba(70, 179, 165, 0.22);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 22px 60px rgba(44, 62, 80, 0.16);
      padding: 34px 30px;
      text-align: center;
    }
    .spinner {
      width: 46px;
      height: 46px;
      margin: 0 auto 18px;
      border-radius: 999px;
      border: 5px solid rgba(70, 179, 165, 0.18);
      border-top-color: #46b3a5;
      animation: spin 0.85s linear infinite;
    }
    h1 { margin: 0; font-size: 1.45rem; font-weight: 900; letter-spacing: -0.02em; }
    p { margin: 12px 0 0; color: #7f8c8d; font-weight: 700; }
    a { color: #159b8f; font-weight: 900; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite" aria-busy="true">
    <div class="spinner"></div>
    <h1>로딩중...</h1>
    <p>잠시만 기다려 주세요.</p>
    <noscript><p><a href="index.html?activity=dictation">계속하기</a></p></noscript>
  </main>
  <script>window.location.replace('index.html?activity=dictation');</script>
</body>
</html>
