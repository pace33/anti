name: Deploy Korean site to aiedue.ddns.net

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-korean-site
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Korean site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check workshop-launcher.mjs
          node --check workshop-service.mjs
          node --check experience-gauge.mjs
          node --check teacher-tutorial.js
          node --check teacher-tutorial-core.mjs
          node --check stage-tutorial.js
          node --check stage-tutorial-core.mjs
          node --check classroom-tools.js
          node --check classroom-service.js
          node --check aiedu-loading.js
          node --check dictation-asteroid-game.js
          node --check dictation-asteroid-core.mjs
          node --check shape-zoo-game.js
          node --check shape-zoo-core.mjs
          node --check drawing-shape-catalog.mjs
          node --check word-card-table-game.js
          node --check word-card-table-core.mjs
          node --check syllable-slow-reader.js
          node --check syllable-slow-reader-core.mjs

      - name: Validate static site structure
        run: |
          node tools/validate-site.mjs
          node --test tools/test-workshop-service.mjs
          node --test tools/test-korean-learning-navigation.mjs tools/test-korean-review-questions.mjs
          node --test tools/test-experience-gauge.mjs
          node --test tools/test-literacy-companion.mjs
          node --test tools/test-teacher-tutorial.mjs
          node --test tools/test-stage-tutorial.mjs
          node --test tools/test-classroom-tools.mjs tools/test-student-diagnostic-retake.mjs
          node --test tools/test-dictation-asteroid-game.mjs tools/test-asteroid-persistence.mjs
          node --test tools/test-shape-zoo-core.mjs tools/test-shape-zoo-game.mjs
          node --test tools/test-word-card-table-core.mjs tools/test-word-card-table-game.mjs tools/test-word-card-table-source.mjs
          node --test tools/test-syllable-slow-reader-core.mjs tools/test-syllable-slow-reader-game.mjs
          node --test tools/test-korean-lab-shell.mjs tools/test-korean-lab-sketchbook-integration.mjs

      - name: Verify modular structure and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js app.css style.css firebase-config.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          grep -q 'src="app.js' index.html
          grep -q 'href="app.css' index.html
          grep -q 'aiedueKoreanDrawings' app.js
          ! grep -q 'korean-db/db-api' app.js
          ! grep -q 'localStorage' app.js
          ! grep -q '<script type="module">' index.html
          test ! -e school-firestore-adapter.js
          test ! -d aidu
          if find . -maxdepth 1 -type f \( -name '*평가문장*' -o -name 'pptx_output*' -o -name 'mattress_comparison.html' \) | grep -q .; then
            echo 'Private or generated work files must not be committed to the deploy root.'
            exit 1
          fi

  deploy:
    name: Verify /korean public sync
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for canonical Pi /korean sync
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:7}"
          url='https://aiedue.ddns.net/korean/.anti-sync-commit'
          for attempt in {1..36}; do
            actual="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$url?attempt=$attempt&sha=$GITHUB_SHA" | tr -d '\r\n')"
            echo "sync attempt $attempt: expected=$expected actual=$actual"
            if [ "$actual" = "$expected" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Pi /korean did not synchronize to $expected in time" >&2
          exit 1

      - name: Smoke test public /korean site
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)-${GITHUB_SHA}"
          base='https://aiedue.ddns.net/korean'
          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base/?v=$stamp" -o /tmp/korean-index.html
          grep -q 'activity-loading-overlay' /tmp/korean-index.html
          grep -q 'src="app.js' /tmp/korean-index.html
          grep -q 'href="app.css' /tmp/korean-index.html
          grep -q 'aiedue-korean-build" content="20260923-workshop-launcher-v2' /tmp/korean-index.html
          grep -q 'app.js?v=20260923-workshop-launcher-v2' /tmp/korean-index.html
          grep -q 'dashboard-warning-tokens-header' /tmp/korean-index.html
          grep -q 'reading-custom-maker' /tmp/korean-index.html
          grep -q 'syllable-slow-reader.js' /tmp/korean-index.html
          grep -q 'sync-warning-tokens' /tmp/korean-index.html

          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base/app.js?v=$stamp" -o /tmp/korean-app.js
          grep -q 'aiedueKoreanDrawingsV2' /tmp/korean-app.js
          grep -q 'adjustStudentKoreanWallet' /tmp/korean-app.js
          grep -q 'warningTokens' /tmp/korean-app.js
          grep -q 'workshop-launcher.mjs?v=20260923-worksheet-sidebar-v1' /tmp/korean-app.js
          ! grep -q 'korean-db/db-api' /tmp/korean-app.js
          ! grep -Eq 'from ["'"'"']https://www\.gstatic\.com/firebasejs/[^"'"'"']+/firebase-(firestore|storage)\.js' /tmp/korean-app.js
          grep -Eq 'from ["'"'"']\./korean-data-adapter\.js' /tmp/korean-app.js

          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base/workshop-launcher.mjs?v=$stamp" -o /tmp/workshop-launcher.mjs
          grep -q '20260923-worksheet-sidebar-v1' /tmp/workshop-launcher.mjs

          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base/workshop/?v=20260923-worksheet-sidebar-v1" -o /tmp/workshop.html
          grep -q 'index-DCzFm7ui.js' /tmp/workshop.html
          grep -q 'index-CN2SodHs.css' /tmp/workshop.html

          curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$base/korean-data-adapter.js?v=$stamp" -o /tmp/korean-data-adapter.js
          grep -q "DEFAULT_ENDPOINT = '/db-api/korean/v2'" /tmp/korean-data-adapter.js
          echo 'Smoke test passed: public /korean and workshop cache-busting markers are reachable.'
