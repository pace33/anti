name: Deploy Korean site to aiedue.ddns.net

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-korean-site
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Korean site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate static site structure
        run: node tools/validate-site.mjs

      - name: Verify modular structure and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js app.css style.css firebase-config.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          grep -q 'src="app.js' index.html
          grep -q 'href="app.css' index.html
          grep -q 'aiedueKoreanDrawings' app.js
          ! grep -q 'korean-db/db-api' app.js
          ! grep -q 'localStorage' app.js
          ! grep -q '<script type="module">' index.html
          test ! -e school-firestore-adapter.js
          test ! -d aidu
          if find . -maxdepth 1 -type f \( -name '*평가문장*' -o -name 'pptx_output*' -o -name 'mattress_comparison.html' \) | grep -q .; then
            echo 'Private or generated work files must not be committed to the deploy root.'
            exit 1
          fi

  deploy:
    name: Deploy /korean on local domain host
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Korean sketchbook patch guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\verify-korean-sketchbook.ps1

      - name: Prepare and deploy approved static files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Get-Location).Path
          $staging = Join-Path $env:RUNNER_TEMP 'aiedue-korean-deploy'
          $destination = 'C:\Users\y5496\Desktop\Aiedue_Korean'
          $approvedFiles = @(
            'index.html',
            'app.js',
            'app.css',
            'style.css',
            'firebase-config.js',
            'drawing.html',
            'hangul.html',
            'dictation.html',
            'literacy.html',
            'aiedu_bgm.mp3',
            'aiedu_click.mp3',
            'aiedu_korean_logo.webp',
            'aiedu_korean_nature_bg.webp',
            'aiedu_korean_dashboard_nature_bg.webp',
            'baby_giyeok.webp',
            'mom_ah.webp'
          )

          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          foreach ($relativePath in $approvedFiles) {
            $from = Join-Path $source $relativePath
            if (!(Test-Path $from)) { throw "Approved deploy file is missing: $relativePath" }
            Copy-Item -Force $from (Join-Path $staging $relativePath)
          }

          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          robocopy $staging $destination /MIR
          $code = $LASTEXITCODE
          if ($code -ge 8) { throw "robocopy failed with exit code $code" }
          $global:LASTEXITCODE = 0
          Write-Host "Deployed approved Korean site files to $destination"

      - name: Validate and reload Caddy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $config = 'C:\Users\y5496\aiedue-repo\Caddyfile'
          if (!(Test-Path $config)) { throw "Caddyfile not found: $config" }
          caddy validate --config $config

          # Static /korean deploys only copy files, but keep reload best-effort for route changes.
          # On the self-hosted Windows runner, `caddy reload` can occasionally hang even after
          # the config is valid and the existing route is serving the copied files. Bound it so
          # the following public smoke test can prove the deployment instead of leaving the run
          # stuck until GitHub cancels it.
          $reloadJob = Start-Job -ScriptBlock { param($configPath) caddy reload --config $configPath } -ArgumentList $config
          if (Wait-Job $reloadJob -Timeout 20) {
            Receive-Job $reloadJob
          } else {
            Stop-Job $reloadJob -ErrorAction SilentlyContinue
            Receive-Job $reloadJob -ErrorAction SilentlyContinue
            Write-Warning 'caddy reload timed out after 20 seconds; continuing to public smoke test.'
          }
          Remove-Job $reloadJob -Force -ErrorAction SilentlyContinue

      - name: Smoke test public /korean site
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $base = 'https://aiedue.ddns.net/korean'
          $html = (Invoke-WebRequest -UseBasicParsing -Uri "$base/?v=$stamp" -Headers @{ 'Cache-Control' = 'no-cache' }).Content
          if ($html -notmatch 'activity-loading-overlay') { throw 'Public page did not include the loading UI.' }
          if ($html -notmatch 'src="app.js') { throw 'Public page did not reference app.js.' }
          if ($html -notmatch 'href="app.css') { throw 'Public page did not reference app.css.' }
          if ($html -notmatch 'dashboard-warning-tokens-header') { throw 'Public page did not include warning-token header marker.' }
          if ($html -notmatch 'sync-warning-tokens') { throw 'Public page did not include warning-token sync markers.' }

          $app = (Invoke-WebRequest -UseBasicParsing -Uri "$base/app.js?v=$stamp" -Headers @{ 'Cache-Control' = 'no-cache' }).Content
          if ($app -notmatch 'aiedueKoreanDrawings') { throw 'Public app.js did not include Firebase drawing storage.' }
          if ($app -notmatch 'adjustStudentKoreanWallet') { throw 'Public app.js did not include teacher warning-token wallet controls.' }
          if ($app -notmatch 'warningTokens') { throw 'Public app.js did not include warning-token persistence.' }
          if ($app -match 'korean-db/db-api') { throw 'Public app.js still references the retired Korean DB mirror.' }
          Write-Host 'Smoke test passed: modular page, warning tokens, and Firebase drawing storage are reachable.'
